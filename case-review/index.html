<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Case Review · Bassi Renata</title>
	<meta name="description" content="Case review presentation by Bassi Renata — Principal Product Designer.">
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../normalize.css">
	<link rel="shortcut icon" href="../favicon.png"/>
	<style>
		*, *::before, *::after { box-sizing: border-box; }

		body {
			margin: 0;
			padding: 0;
			background: #ffffff;
			color: #111;
			font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}

		header {
			padding: 24px clamp(16px, 4vw, 56px);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
		}

		header a {
			color: #111;
			text-decoration: none;
			font-size: 0.9em;
			transition: color 0.2s ease-out;
		}

		header a:hover { color: #F0002C; }

		.slide-wrapper {
			flex: 1;
			padding: clamp(0px, 2vw, 32px);
			padding-top: 0;
			display: flex;
			flex-direction: column;
		}

		.slide-container {
			width: 100%;
			max-width: 1240px;
			margin: 0 auto;
			flex: 1;
			aspect-ratio: 16 / 9;
			position: relative;
		}

		iframe {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			border: none;
			border-radius: 12px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.08);
		}
	</style>
</head>
<body>
	<header>
		<a href="../">← Bassi Renata</a>
		<a href="https://www.figma.com/deck/RACSKMGG7gKFNq9zgXhMke" target="_blank" rel="noopener noreferrer">Abrir no Figma ↗</a>
	</header>

	<div class="slide-wrapper">
		<div class="slide-container">
			<iframe
				src="https://www.figma.com/embed?embed_host=share&url=https://www.figma.com/deck/RACSKMGG7gKFNq9zgXhMke"
				allowfullscreen
				loading="lazy"
				title="Case Review — Bassi Renata"
			></iframe>
		</div>
	</div>
</body>
</html>
